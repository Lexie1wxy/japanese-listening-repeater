<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">日语听力复读播放器界面示意图</title>
  <desc id="desc">A clean local Japanese listening repeater interface with playlists, subtitles, and repeat controls.</desc>
  <rect width="1280" height="720" fill="#f5f6f9"/>
  <rect x="34" y="32" width="1212" height="656" rx="18" fill="#ffffff" stroke="#dde1ea"/>
  <rect x="34" y="32" width="1212" height="64" rx="18" fill="#ffffff"/>
  <rect x="34" y="84" width="1212" height="1" fill="#eceef3"/>
  <text x="82" y="73" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#1b2230">日语听力复读</text>
  <circle cx="60" cy="64" r="18" fill="#f5f6f9"/>
  <text x="53" y="72" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" fill="#1b2230">‹</text>
  <rect x="40" y="96" width="220" height="532" fill="#ffffff"/>
  <rect x="260" y="96" width="1" height="532" fill="#eceef3"/>
  <text x="64" y="136" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8a94a6">我的听力材料 · 3 集</text>
  <rect x="56" y="158" width="188" height="44" rx="8" fill="#eef3ff"/>
  <text x="76" y="185" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#3d7bfd">01  朝のニュース</text>
  <rect x="56" y="212" width="188" height="44" rx="8" fill="#f5f6f9"/>
  <text x="76" y="239" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#1b2230">02  インタビュー</text>
  <rect x="56" y="266" width="188" height="44" rx="8" fill="#f5f6f9"/>
  <text x="76" y="293" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#1b2230">03  教材会話</text>
  <rect x="56" y="330" width="188" height="42" rx="8" fill="#ffffff" stroke="#dde1ea" stroke-dasharray="6 5"/>
  <text x="105" y="356" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8a94a6">＋ 添加音频</text>
  <rect x="284" y="96" width="650" height="532" fill="#f5f6f9"/>
  <text x="312" y="136" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8a94a6">154 句</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="308" y="160" width="586" height="82" rx="10" fill="#eef3ff" stroke="#d6defc"/>
    <text x="327" y="190" font-size="14" fill="#3d7bfd">01</text>
    <text x="366" y="190" font-size="20" fill="#1b2230">今日はまず、音を聞いて意味を取ります。</text>
    <text x="366" y="218" font-size="16" fill="#e07b39">きょうはまず、おとをきいていみをとります。</text>
    <rect x="308" y="252" width="586" height="82" rx="10" fill="#f6f8fd"/>
    <text x="327" y="282" font-size="14" fill="#b6bdcb">02</text>
    <text x="366" y="282" font-size="20" fill="#1b2230">聞こえた単語を、すぐ声に出してみましょう。</text>
    <text x="366" y="310" font-size="16" fill="#8a94a6">把听到的词马上说出来。</text>
    <rect x="308" y="344" width="586" height="82" rx="10" fill="#f6f8fd"/>
    <text x="327" y="374" font-size="14" fill="#b6bdcb">03</text>
    <text x="366" y="374" font-size="20" fill="#1b2230">同じ段落を五回くり返して練習します。</text>
    <text x="366" y="402" font-size="16" fill="#8a94a6">同一段落重复五遍练习。</text>
    <rect x="308" y="436" width="586" height="82" rx="10" fill="#ffffff"/>
    <text x="327" y="466" font-size="14" fill="#b6bdcb">04</text>
    <text x="366" y="466" font-size="20" fill="#1b2230">終わったら、自動で次の五文へ進みます。</text>
  </g>
  <rect x="934" y="96" width="1" height="532" fill="#eceef3"/>
  <rect x="935" y="96" width="311" height="532" fill="#ffffff"/>
  <circle cx="1090" cy="206" r="86" fill="#141926"/>
  <circle cx="1090" cy="206" r="58" fill="#2b3448"/>
