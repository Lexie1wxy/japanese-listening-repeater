  <circle cx="1090" cy="206" r="28" fill="#e0533d"/>
  <circle cx="1090" cy="206" r="7" fill="#e9ebf2"/>
  <text x="999" y="330" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1b2230">朝のニュース</text>
  <text x="1022" y="357" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8a94a6">本地音频 · 1 / 3 集</text>
  <rect x="976" y="394" width="76" height="34" rx="8" fill="#f5f6f9" stroke="#dde1ea"/>
  <text x="994" y="417" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1b2230">🔁 单句</text>
  <rect x="1062" y="394" width="76" height="34" rx="8" fill="#3d7bfd"/>
  <text x="1080" y="417" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffffff">⇄ 段落</text>
  <rect x="1148" y="394" width="76" height="34" rx="8" fill="#f5f6f9" stroke="#dde1ea"/>
  <text x="1163" y="417" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1b2230">▶▶ 逐句</text>
  <text x="990" y="470" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8a94a6">每段 5 句 · 重复 5 遍</text>
  <text x="990" y="504" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8a94a6">段尾自动接下一段</text>
  <rect x="34" y="628" width="1212" height="60" fill="#ffffff"/>
  <rect x="34" y="628" width="1212" height="1" fill="#eceef3"/>
  <circle cx="104" cy="658" r="18" fill="#f5f6f9" stroke="#dde1ea"/>
  <text x="94" y="665" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#1b2230">⏮</text>
  <circle cx="152" cy="658" r="23" fill="#3d7bfd"/>
  <text x="143" y="666" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#ffffff">⏸</text>
  <circle cx="206" cy="658" r="18" fill="#f5f6f9" stroke="#dde1ea"/>
  <text x="196" y="665" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#1b2230">⏭</text>
